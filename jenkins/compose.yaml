
services:
  deploy-agent:
    build:
      context: .
      dockerfile: Dockerfile.deploy-agent
    image: jenkins-mlops-deploy-agent:local
    container_name: jenkins-mlops-deploy-agent
    restart: unless-stopped
    depends_on:
      - jenkins
    user: "0:0"
    environment:
      JENKINS_URL: http://jenkins:8080/
      JENKINS_AGENT_NAME: deploy-agent
      JENKINS_WEB_SOCKET: "true"
    entrypoint: ["/bin/sh", "/opt/jenkins/start-agent.sh"]
    volumes:
      - deploy_agent_home:/home/jenkins/agent
      - ./start-agent.sh:/opt/jenkins/start-agent.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    secrets:
      - source: deploy-agent-secret
        target: agent-secret

  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: jenkins-mlops-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: jenkins-mlops-agent:local
    container_name: jenkins-mlops-agent
    restart: unless-stopped
    depends_on:
      - jenkins
    entrypoint: ["/bin/sh", "/opt/jenkins/start-agent.sh"]
    volumes:
      - agent_home:/home/jenkins/agent
      - ./start-agent.sh:/opt/jenkins/start-agent.sh:ro
    secrets:
      - agent-secret
    environment:
      JENKINS_URL: http://jenkins:8080/
      JENKINS_AGENT_NAME: mlops-agent
      JENKINS_WEB_SOCKET: "true"

  buildkit:
    image: moby/buildkit:buildx-stable-1
    container_name: jenkins-mlops-buildkit
    restart: unless-stopped
    privileged: true
    command:
      - --addr
      - tcp://0.0.0.0:1234
    expose:
      - "1234"
    volumes:
      - buildkit_data:/var/lib/buildkit

volumes:
  jenkins_home:
  agent_home:
  buildkit_data:
  deploy_agent_home:

secrets:
  deploy-agent-secret:
    file: ./secrets/deploy-agent-secret
  agent-secret:
    file: ./secrets/agent-secret

